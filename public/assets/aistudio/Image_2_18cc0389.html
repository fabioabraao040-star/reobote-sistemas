rem","gutter-compact":"0.5rem","space-xl":"2rem"},"fontFamily":{"headline-lg":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"display-lg":["Plus Jakarta Sans"],"display-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"code-sm":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"]},"fontSize":{"headline-lg":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-md":["16px",{"lineHeight":"24px","letterSpacing":"-0.005em","fontWeight":"600"}],"display-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"display-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"body-md":["13px",{"lineHeight":"18px","letterSpacing":"0em","fontWeight":"400"}],"code-sm":["12px",{"lineHeight":"16px","letterSpacing":"0em","fontWeight":"500"}],"body-lg":["15px",{"lineHeight":"22px","letterSpacing":"0em","fontWeight":"400"}],"label-md":["13px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"400"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col justify-center"><main class="w-full bg-surface"><div class="flex flex-col w-full">
<div class="min-h-[calc(100vh-80px)] w-full flex items-center justify-center p-gutter" style="background-color: #E8EDF3;">
<div class="w-full max-w-[440px] bg-white rounded-xl shadow-xl p-8 sm:p-10 flex flex-col items-center relative overflow-hidden transition-all duration-300">
<div class="w-full flex items-center justify-center gap-3 mb-6">
<div class="w-10 h-10 rounded-lg flex items-center justify-center text-white shadow-sm flex-shrink-0" style="background-color: #C5A15B;">
<span class="material-symbols-outlined text-[24px]">headset_mic</span>
</div>
<div class="flex flex-col">
<span class="font-display-md text-headline-md tracking-wider uppercase font-bold" style="color: #34445C;">
            REOBOTE
          </span>
<span class="font-label-sm text-[10px] tracking-widest uppercase font-semibold opacity-75" style="color: #34445C;">
            Sistema de Atendimento
          </span>
</div>
</div>
<div class="w-full text-center mb-8">
<h1 class="font-headline-lg text-headline-lg font-bold mb-1" style="color: #34445C;">
          Bem-vindo de volta
        </h1>
<p class="font-body-md text-body-md opacity-80" style="color: #34445C;">
          Acesse a central para gerenciar seus atendimentos
        </p>
</div>
<form class="w-full flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5 w-full">
<label class="font-label-md text-label-md font-semibold text-left" for="email" style="color: #34445C;">
            E-mail
          </label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[18px] opacity-50" style="color: #34445C;">
              mail
            </span>
<input class="w-full pl-10 pr-4 py-2.5 rounded-lg font-body-md text-body-md bg-surface-container-lowest outline-none transition-all duration-200" id="email" name="email" onblur="this.style.boxShadow='inset 0 0 0 1px #D8E0EA'" onfocus="this.style.boxShadow='inset 0 0 0 1.5px #C5A15B, 0 0 0 3px rgba(197, 161, 91, 0.15)'" placeholder="seu.email@empresa.com" required="" style="color: #34445C; box-shadow: inset 0 0 0 1px #D8E0EA;" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5 w-full">
<div class="flex items-center justify-between w-full">
<label class="font-label-md text-label-md font-semibold" for="password" style="color: #34445C;">
              Senha
            </label>
<a class="font-label-sm text-label-sm hover:underline transition-opacity duration-150" href="#" style="color: #C5A15B;">
              Esqueci minha senha
            </a>
</div>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-[18px] opacity-50" style="color: #34445C;">
              lock
            </span>
<input class="w-full pl-10 pr-11 py-2.5 rounded-lg font-body-md text-body-md bg-surface-container-lowest outline-none transition-all duration-200" id="password" name="password" onblur="this.style.boxShadow='inset 0 0 0 1px #D8E0EA'" onfocus="this.style.boxShadow='inset 0 0 0 1.5px #C5A15B, 0 0 0 3px rgba(197, 161, 91, 0.15)'" placeholder="••••••••" required="" style="color: #34445C; box-shadow: inset 0 0 0 1px #D8E0EA;" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-3 top-1/2 -translate-y-1/2 text-[18px] opacity-50 hover:opacity-100 flex items-center justify-center transition-opacity" id="toggle-password" style="color: #34445C;" type="button">
<span class="material-symbols-outlined text-[18px]" id="password-icon">visibility</span>
</button>
</div>
</div>
<button class="w-full mt-2 py-3 rounded-lg font-label-md text-label-md text-white font-semibold transition-all duration-200 shadow-sm hover:brightness-95 active:scale-[0.99] flex items-center justify-center gap-2" style="background-color: #C5A15B;" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 w-full flex items-center justify-center text-center" style="box-shadow: 0 -1px 0 0 #D8E0EA;">
<p class="font-body-md text-body-md" style="color: #34445C;">
          Não tem uma conta? 
          <a class="font-semibold hover:underline ml-1" href="#" style="color: #C5A15B;">
            Cadastre-se
          </a>
</p>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('password-icon');

    if (toggleBtn && passwordInput && passwordIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
